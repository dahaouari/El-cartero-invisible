<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cartero Invisible</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1 id="titolPrincipal">El Cartero Invisible</h1>
        <p class="info">
            <marquee>Benvingut al teu buzón virtual</marquee>
        </p>
        <button id="btnTema" class="btn-tema" type="button">🌙 Canviar Tema</button>
    </header>

    <main>
        <section id="benvinguda">
            <button id="btnSaluda" type="button">Saluda'm!</button>
        </section>

        <section id="llistatCartes">
            <h2>📬 Cartes rebudes</h2>
            <button id="btnMostrar" type="button">👁️ Amagar Cartes</button>
            <button id="btnAfegir" type="button">➕ Afegir carta de prova</button>
            <div id="contenidorCartes"></div>
            <div class="clearfix"></div>
        </section>

        <section id="formulariCarta">
            <h2>✍️ Escriu una nova carta</h2>
            <form id="formCarta">
                <input type="text" id="remitent" placeholder="Remitent" required>
                <input type="text" id="destinatari" placeholder="Destinatari" required>
                <textarea id="contingut" placeholder="Contingut..." required></textarea>
                <input type="text" id="personatge" placeholder="Personatge (Einstein)">
                <button type="submit">📨 Enviar</button>
            </form>
        </section>

        <section id="editarCartaFallback" hidden>
            <h2>✏️ Editar carta</h2>
            <form id="formEditarFallback">
                <input type="hidden" id="editIdFallback">
                <input type="text" id="editRemitentFallback" placeholder="Remitent" required>
                <input type="text" id="editDestinatariFallback" placeholder="Destinatari" required>
                <textarea id="editContingutFallback" placeholder="Contingut..." required></textarea>
                <input type="text" id="editPersonatgeFallback" placeholder="Personatge (Einstein)">
                <button type="submit">💾 Desar</button>
                <button type="button" id="btnCancelarEdicioFallback">❌ Cancel·lar</button>
            </form>
        </section>

        <section id="registre">
            <h2>📋 Registre</h2>
            <button id="btnMostrarTaula" type="button">👁️ Mostrar Taula</button>
            <table id="taulaCartes" hidden>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Remitent</th>
                        <th>Destinatari</th>
                        <th>Contingut</th>
                        <th>Accions</th>
                    </tr>
                </thead>
                <tbody id="cosTaula"></tbody>
            </table>
        </section>
    </main>

    <!-- 🟦 SETMANA 6: Modal d'Edició -->
    <div id="modalEdicio" class="modal-overlay" hidden>
        <div class="modal-box">
            <div class="modal-header">
                <h2>✏️ Editar carta</h2>
                <button id="btnTancarModal" class="btn-tancar" type="button">&times;</button>
            </div>

            <form id="formEditar" class="modal-form">
                <input type="hidden" id="editId">

                <div class="form-columns">
                    <div class="form-group">
                        <label for="editRemitent">Remitent</label>
                        <input type="text" id="editRemitent" placeholder="Qui envia la carta?" required>
                    </div>

                    <div class="form-group">
                        <label for="editDestinatari">Destinatari</label>
                        <input type="text" id="editDestinatari" placeholder="A qui va dirigida?" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="editPersonatge">Personatge</label>
                    <input type="text" id="editPersonatge" placeholder="Ex: Einstein, Newton...">
                </div>

                <div class="form-group">
                    <label for="editContingut">Contingut</label>
                    <textarea id="editContingut" rows="4" placeholder="Escriu el contingut de la carta..." required></textarea>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn-guardar">💾 Desar canvis</button>
                    <button type="button" id="btnCancel·larEdicio" class="btn-cancel·lar">❌ Cancel·lar</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 El Cartero Invisible</p>
    </footer>
    <div id="buzon">📮</div>

    <script type="module" src="js/script.js"></script>
</body>

</html>
